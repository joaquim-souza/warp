Id: json-to-xml
Version: 1
SourceFormat: json
TargetFormat: xml
Description: Converts a JSON product document into generic XML
OutputRoot: Product

Mappings:
  - SourcePath: product.id
    TargetPath: id
    Required: true

  - SourcePath: product.name
    TargetPath: name
    Required: true

  - SourcePath: product.price
    TargetPath: price
    Required: false
    Transform: ToNumber

  - SourcePath: product.category
    TargetPath: category
    Required: false